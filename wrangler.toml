name = "bot-wow"
main = "worker/index.js"
compatibility_date = "2026-10-17"

[[d1_databases]]
binding = "DB"
database_name = "botwow-production"
database_id = "e57f5874-a9f0-42bf-8dbc-10785ef083f5"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "5cca39707796468f83d2016350794f72"

[[r2_buckets]]
binding = "R2_BINARIES"
bucket_name = "botwow-binaries"

[[domains]]
domain = "api.bot-wow.com"

[vars]
# FIX 2026-10-21 : l'environnement ne doit plus宣称 "development" alors que
# la boutique est en production. Le passage reel en mode "live" depend des
# secrets Mollie (voir documentation/deployment.md).
ENVIRONMENT = "production"
# Nom de l'objet R2 livre au client (le build produit
# casinobabe-fishing-<version>.zip ; le Worker essaie aussi ce nom et l'ancien
# "Casinobabe-v1.0.38.zip" par repli).
R2_OBJECT_KEY = "casinobabe-fishing-1.2.0.zip"
# Expediteur des e-mails de livraison (la cle d'envoi est un SECRET Cloudflare).
MAIL_FROM = "BOT-WOW <licences@bot-wow.com>"

# ---------------------------------------------------------------------------
# SECRETS A CONFIGURER (wrangler secret put <NOM>) — JAMAIS dans le code :
#   MOLLIE_API_KEY        cle API Mollie (mode test ou live selon le compte)
#   MOLLIE_WEBHOOK_SECRET secret de signature des webhooks (optionnel :
#                         le webhook verifie l'etat du paiement via l'API)
#   MOLLIE_PROFILE_ID    identifiant de profil Mollie (optionnel)
#   RESEND_API_KEY        cle d'envoi d'e-mails (livraison de la licence)
# ---------------------------------------------------------------------------
