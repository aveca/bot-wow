name: Deploy Bot-Wow to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static project
        run: npm run validate

      - uses: actions/configure-pages@v5

      # FIX 2026-10-21 : le deploiement uploadait TOUT le depot, ce qui
      # exposait publiquement worker/index.js, les migrations SQL, package.json
      # et les sources. L'artefact ne contient plus que le site statique.
      - name: Prepare static artifact
        run: |
          mkdir -p _site
          for f in index.html demo.html success.html cancel.html 404.html .nojekyll; do
            [ -e "$f" ] && cp "$f" _site/
          done
          for d in assets docs legal; do
            [ -d "$d" ] && cp -r "$d" _site/
          done
          echo "--- contenu de l'artefact ---"
          ls -1 _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4