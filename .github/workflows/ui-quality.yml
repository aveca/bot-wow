name: UI quality and visual evidence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate static project
        run: npm run validate
      # Le stamp des assets est verifie par npm test : il doit deja etre juste
      # dans l'arbre committe. Le recalculer AVANT les tests masquait un stamp
      # perime (PR #118 : HTML b4232c44, empreinte 560cff9a, CI verte a tort).
      - name: Run unit and integration tests
        run: npm test
      - name: Recompute deterministic asset fingerprint and URLs
        run: node scripts/versionne-assets.mjs
      - name: Audit all CSS selectors and tokens
        run: npm run audit:css
      - name: Build the publishable site artifact
        run: node scripts/build-site.mjs _site
      - name: Install Chromium for Playwright
        # --with-deps retire : apt-get tente de contacter azure.archive.ubuntu.com
        # sur le runner ubuntu-24.04 et echoue (Temporary failure resolving).
        # Ce probleme DNS est infrastructurel (pas de code en cause). Les images
        # runners GitHub Actions ubuntu-24.04 embarquent deja les bibliotheques
        # systeme Chromium ; on installe seulement le binaire Chromium.
        run: npx playwright install chromium
      - name: Run real-browser UI checks
        run: npm run test:e2e
      - name: Preserve UI screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-wow-ui-quality-evidence
          path: artifacts/ui/
          if-no-files-found: warn
          retention-days: 14
