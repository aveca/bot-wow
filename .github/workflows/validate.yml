name: Validate Bot-Wow

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static project
        run: npm run validate

      - name: Reject duplicate active agent locks on other open pull requests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OPEN_PR_LOCKS: "1"
        run: node scripts/check-agent-state.mjs

      # Tests de la demonstration (parite JS/Python des regles de ronde) et
      # de la distribution (integrite du paquet, absence de donnees client).
      # La parite est IGNOREE si Python n'est pas disponible sur le runner.
      - name: Run demo and distribution tests
        run: npm test

      # Le stamp des assets est VERIFIE par ces tests : il doit donc deja etre
      # juste dans l'arbre committe. Recalculer le stamp AVANT les tests masquait
      # un stamp perime (PR #118 : HTML en b4232c44, empreinte 560cff9a, CI verte
      # alors qu'un checkout propre echouait). Le recalcul reste utile pour le
      # build lorsqu'un asset vient de changer, mais il ne doit plus cacher
      # l'ecart entre le depot et son empreinte.
      - name: Recompute deterministic asset fingerprint and URLs
        run: node scripts/versionne-assets.mjs

  # Build the real source checkout into an isolated candidate. Never upload it.
  package-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout BOT-WOW
        uses: actions/checkout@v4
        with:
          path: bot-wow

      - name: Checkout Casinobabe runtime source
        uses: actions/checkout@v4
        with:
          repository: aveca/Casinobabe
          ref: feat/fishing-route-intelligence-v2
          path: bot-wow/.source/runtime-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build twice and verify byte-identical real package candidates (no publication)
        shell: bash
        working-directory: ${{ github.workspace }}/bot-wow
        run: |
          set -euo pipefail
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          ls -ld "$GITHUB_WORKSPACE/bot-wow" "$GITHUB_WORKSPACE/bot-wow/.source/runtime-source"
          BOT_WOW_DIR="$GITHUB_WORKSPACE/bot-wow"
          SOURCE_DIR="$GITHUB_WORKSPACE/bot-wow/.source/runtime-source"
          SOURCE_SHA="$(git -C "$SOURCE_DIR" rev-parse HEAD)"
          ZIP_NAME="casinobabe-fishing-1.2.2-rc.1.zip"
          OUT_FIRST="/tmp/botwow-package-candidate-first"
          OUT_SECOND="/tmp/botwow-package-candidate-second"

          node "$BOT_WOW_DIR/scripts/build-package.cjs" \
            --source "$SOURCE_DIR" \
            --version 1.2.2-rc.1 \
            --out "$OUT_FIRST" \
            --source-repo aveca/Casinobabe \
            --source-ref feat/fishing-route-intelligence-v2 \
            --source-commit "$SOURCE_SHA"
          node "$BOT_WOW_DIR/scripts/verify-package-archive.cjs" \
            "$OUT_FIRST/$ZIP_NAME" \
            1.2.2-rc.1 "$SOURCE_SHA"

          node - "$OUT_FIRST/casinobabe-fishing-1.2.2-rc.1/MANIFEST.json" <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rights = manifest.distribution || {};
          const unresolved = rights.unresolvedComponents || [];
          const expectedCommit = 'b625ccec5fd61225dd92c5c54fa8721da76c3876';
          if (rights.mode !== 'qa'
            || rights.eligible !== false
            || rights.sourceRepositoryMatches !== true
            || rights.sourceCommitMatches !== true
            || rights.expectedSourceCommit !== expectedCommit
            || !unresolved.includes('Code original Casinobabe')) {
            console.error('::error::Candidate rights manifest is not pinned and fail-closed.');
            console.error(JSON.stringify(rights, null, 2));
            process.exit(1);
          }
          console.log('RELEASE RIGHTS: BLOCKED AS EXPECTED; source provenance exact; client terms pending.');
          NODE

          node "$BOT_WOW_DIR/scripts/build-package.cjs" \
            --source "$SOURCE_DIR" \
            --version 1.2.2-rc.1 \
            --out "$OUT_SECOND" \
            --source-repo aveca/Casinobabe \
            --source-ref feat/fishing-route-intelligence-v2 \
            --source-commit "$SOURCE_SHA"
          node "$BOT_WOW_DIR/scripts/verify-package-archive.cjs" \
            "$OUT_SECOND/$ZIP_NAME" \
            1.2.2-rc.1 "$SOURCE_SHA"

          ZIP_FIRST="$OUT_FIRST/$ZIP_NAME"
          ZIP_SECOND="$OUT_SECOND/$ZIP_NAME"
          if ! cmp -s "$ZIP_FIRST" "$ZIP_SECOND"; then
            echo "::error::Two builds from the same source SHA produced different ZIP bytes."
            sha256sum "$ZIP_FIRST" "$ZIP_SECOND"
            exit 1
          fi

          # The Worker deliberately accepts stable R2 keys only. Map the RC bytes
          # to a stable-format key in this isolated in-memory mock; no R2 write occurs.
          BOTWOW_PACKAGE_FIXTURE="$ZIP_FIRST" BOTWOW_PACKAGE_KEY="casinobabe-fishing-1.2.2.zip" \
            node "$BOT_WOW_DIR/tests/delivery-replay.test.mjs"

          echo "PACKAGE REPRODUCIBILITY: PASS"
          echo "source_sha=$SOURCE_SHA"
          sha256sum "$ZIP_FIRST" "$ZIP_SECOND"
          stat -c 'candidate_size_bytes=%s' "$ZIP_FIRST"
