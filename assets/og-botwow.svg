<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BOT-WOW — route planner demo</title>
  <desc id="desc">Original abstract route-planning graphic. Browser demo uses simulated data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18"/>
      <stop offset="1" stop-color="#111d2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7f5"/>
      <stop offset="1" stop-color="#f0b75e"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8ba4b8" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="900" cy="300" r="190" fill="#45cfe0" opacity=".08" filter="url(#glow)"/>
  <g fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M710 430L820 330L930 370L1030 220" stroke-width="5" opacity=".9"/>
    <path d="M710 430L820 330L930 370L1030 220" stroke-width="20" opacity=".12" filter="url(#glow)"/>
    <circle cx="710" cy="430" r="12" fill="#5ee7f5" stroke="none"/>
    <circle cx="820" cy="330" r="12" fill="#5ee7f5" stroke="none"/>
    <circle cx="930" cy="370" r="12" fill="#e7c06b" stroke="none"/>
    <circle cx="1030" cy="220" r="14" fill="#f0b75e" stroke="none"/>
    <circle cx="710" cy="430" r="25" stroke-width="2" opacity=".45"/>
    <circle cx="820" cy="330" r="25" stroke-width="2" opacity=".45"/>
    <circle cx="930" cy="370" r="25" stroke-width="2" opacity=".45"/>
    <circle cx="1030" cy="220" r="29" stroke-width="2" opacity=".45"/>
  </g>
  <g transform="translate(92 160)">
    <path d="M48 0L6 98H90L48 0Z" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M48 23V74M25 61H71" stroke="#eaf4f8" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="92" y="340" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="2">BOT-WOW</text>
  <text x="96" y="402" fill="#b6c5d1" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500">Route planner demo</text>
  <rect x="96" y="450" width="360" height="44" rx="22" fill="#152d3b" stroke="#5ee7f5" stroke-opacity=".55"/>
  <text x="276" y="479" fill="#bdeff4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="1">SIMULATED DATA · BROWSER ONLY</text>
  <text x="96" y="565" fill="#73899a" font-family="Arial, Helvetica, sans-serif" font-size="16">Independent visual identity · no game artwork or third-party logos</text>
</svg>