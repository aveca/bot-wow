<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-label="BOT-WOW mascot — idle fishing bot" class="mascot idle">
  <defs>
    <linearGradient id="m-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c45a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="m-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1205;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0600;stop-opacity:1" />
    </linearGradient>
    <filter id="m-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="12" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="200" cy="410" rx="90" ry="18" fill="#000" opacity="0.25" />

  <!-- Body -->
  <path d="M150 280 Q150 320 190 340 Q230 360 250 340 Q250 300 220 280 Z" fill="url(#m-deep)" />
  <path d="M155 285 Q155 315 195 335 Q230 355 245 335 Q245 305 225 285 Z" fill="#2a1e0c" />

  <!-- Head -->
  <circle cx="190" cy="215" r="42" fill="url(#m-deep)" />
  <circle cx="195" cy="220" r="38" fill="#2a1e0c" />

  <!-- Face mask / visor -->
  <path d="M160 205 Q190 195 220 205 Q220 235 190 245 Q160 235 160 205 Z" fill="#1a1205" />
  <rect x="165" y="208" width="50" height="14" rx="7" fill="#0a0600" />

  <!-- Eyes -->
  <circle cx="175" cy="212" r="5" fill="#c9a227" />
  <circle cx="175" cy="212" r="2" fill="#fff" />
  <circle cx="205" cy="212" r="5" fill="#c9a227" />
  <circle cx="205" cy="212" r="2" fill="#fff" />

  <!-- Antenna -->
  <path d="M190 175 Q190 150 205 140 Q215 135 215 150" fill="none" stroke="#c9a227" stroke-width="3" stroke-linecap="round" />
  <circle cx="215" cy="135" r="4" fill="#c9a227" />

  <!-- Fishing rod -->
  <path d="M240 260 Q260 200 280 180 Q285 170 295 185 Q280 205 260 255 Q240 270 240 260 Z" fill="#1a1205" />
  <path d="M245 265 Q255 220 275 195 Q280 185 288 200 Q270 215 255 255 Q245 268 245 265 Z" fill="#2a1e0c" />
  <line x1="245" y1="265" x2="235" y2="280" stroke="#c9a227" stroke-width="2" stroke-linecap="round" />

  <!-- Float / bobber on line -->
  <circle cx="238" cy="282" r="3" fill="#c9a227" />
  <circle cx="238" cy="282" r="1.5" fill="#fff" />

  <!-- Arm -->
  <path d="M150 285 Q130 300 125 330 Q120 350 140 345 Q150 330 160 315 Q155 300 150 285 Z" fill="url(#m-deep)" />
  <path d="M155 290 Q135 305 130 335 Q125 355 145 350 Q155 335 165 320 Q160 305 155 290 Z" fill="#2a1e0c" />

  <!-- Legs -->
  <path d="M170 340 Q165 380 160 410 Q150 420 160 415 Q165 405 175 375 Q180 350 170 340 Z" fill="url(#m-deep)" />
  <path d="M210 340 Q215 380 220 410 Q230 420 220 415 Q215 405 205 375 Q200 350 210 340 Z" fill="url(#m-deep)" />

  <!-- Boots -->
  <path d="M145 405 Q145 425 155 430 Q165 425 165 410 Q160 405 155 405 Z" fill="#1a1205" />
  <path d="M205 405 Q205 425 215 430 Q225 425 225 410 Q220 405 215 405 Z" fill="#1a1205" />

  <!-- Gold details -->
  <circle cx="190" cy="170" r="6" fill="url(#m-gold)" />
  <circle cx="190" cy="170" r="2.5" fill="#fff" />
  <path d="M175 240 Q190 245 205 240" fill="none" stroke="#c9a227" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
